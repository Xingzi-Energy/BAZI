<!doctype html>
<html lang="en">
    <head>
        <meta name="version" content="102" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            Ba Zi 八字 - Astronomically-accurate Potentiality-pillars Calculator
            | JUNGLESTAR | v105
        </title>
        <style>
            :root {
                --color_primary: oklch(0.87 0.28 142);
                --color_primary_light: oklch(0.89 0.25 142);
                --color_secondary: oklch(0.69 0.2 142);
                --bg_dark: oklch(0.15 0.02 142);
                --bg_mid: oklch(0.25 0.05 142);
                --bg_light: oklch(0.18 0.03 142);
                --bg_surface: oklch(1 0 0 / 0.05);
                --bg_surface_hover: oklch(0 0 0 / 0.25);
                --text_primary: oklch(1 0 0);
                --text_secondary: oklch(0.72 0 0);
                --border_visible: 1px solid oklch(1 0 0 / 0.2);
                --border_green: 1px solid oklch(0.87 0.28 142 / 0.3);
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html { background-color: #000; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: linear-gradient(135deg, var(--bg_dark) 0%, var(--bg_mid) 50%, var(--bg_light) 100%);
                min-height: 100vh;
                color: var(--text_primary);
                padding: 1svh;
            }
            .container { max-width: 1200px; margin: 0 auto; }
            header { text-align: center; margin-bottom: 1svh; padding: 1svh; }
            h1 {
                font-size: 3rem;
                margin-bottom: 0.5svh;
                background: linear-gradient(45deg, var(--color_primary), var(--color_primary_light));
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                font-weight: 300;
                letter-spacing: 3px;
                display: flex;
                justify-content: space-between;
            }
            .validation_badge {
                display: inline-block;
                border: 1px solid var(--color_primary);
                color: var(--color_primary);
                padding: 0.25svh 1svh;
                border-radius: 1svh;
                font-size: 0.9rem;
            }
            .section_card {
                background: rgba(0, 30, 10, 0.6);
                border-radius: 0.75svh;
                padding: 1.5svh;
                margin: 1.5svh;
                backdrop-filter: blur(0.75svh);
            }
            h2.section_title { margin-bottom: 1.5svh; font-size: 1.95rem; font-weight: 300; text-align: center; text-transform: uppercase; }
            .input_grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 1svh;
                margin-bottom: 1svh;
            }
            .input_group { display: flex; flex-direction: column; }
            label {
                margin-bottom: 0.25svh;
                color: var(--color_primary_light);
                font-size: 0.9rem;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            input, select {
                padding: 0.5svh;
                border: var(--border_visible);
                background: var(--bg_surface);
                color: var(--text_primary);
                border-radius: 0.175svh;
                font-size: 1.1rem;
            }
            select { padding: 0.75svh; border-radius: 0.5svh; }
            select option { background-color: #121b14; color: #fff; }
            button {
                background: linear-gradient(45deg, var(--color_primary), var(--color_secondary));
                color: var(--bg_dark);
                border: none;
                padding: 0.75svh 1.5svh;
                border-radius: 1svh;
                font-size: 1.1rem;
                font-weight: bold;
                cursor: pointer;
                transition: transform 0.2s;
                margin-top: 0.5svh;
                margin-right: 0.5svh;
            }
            button.stroke { background: none; color: var(--color_primary); border: 2px solid var(--color_primary); }
            button:hover { transform: translateY(-2px); }
            .date_display { font-size: 1.95rem; color: var(--color_primary); text-align: center; }
            .date_display small { font-size: 50%; display: block; color: var(--text_secondary); }
            .pillars_container {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 0.5svh;
                margin: 1.5svh 0;
            }
            .pillar {
                background: var(--bg_surface_hover);
                border-radius: 0.5svh;
                padding: 0.75svh;
                text-align: center;
                border: 2px solid oklch(0.87 0.28 142 / 0.3);
                position: relative;
            }
            .pillar_title {
                font-size: 1.3rem;
                color: var(--color_primary_light);
                margin-bottom: 1svh;
                font-weight: 300;
                opacity: 0.5;
            }
            .stem_branch { display: flex; justify-content: center; align-items: center; gap: 0.75svh; margin: 0.75svh 0; }
            .chinese_char { font-size: 2rem; font-weight: bold; }
            .pinyin { color: var(--text_secondary); font-size: 1.1rem; margin-top: 3px; }
            .element {
                display: inline-block;
                padding: 5px 1svh;
                border-radius: 1.5svh;
                font-size: 1rem;
                margin: 1svh 0;
                font-weight: bold;
            }
            .element_wood { background: oklch(0.69 0.2 142 / 0.3); color: oklch(0.69 0.2 142); }
            .element_fire { background: oklch(0.64 0.2 41 / 0.3); color: oklch(0.64 0.2 41); }
            .element_earth { background: oklch(0.7 0.15 85 / 0.3); color: oklch(0.7 0.15 85); }
            .element_metal { background: oklch(0.82 0 0 / 0.3); color: oklch(0.82 0 0); }
            .element_water { background: oklch(0.6 0.18 237 / 0.3); color: oklch(0.6 0.18 237); }
            .animal_emoji { font-size: 4.5rem; margin: 0.5svh 0; }
            .animal_info { font-size: 1.8rem; margin: 0.5svh 0; font-weight: 500; }
            .Yin { color: oklch(0.53 0.25 289 / 0.75); }
            .Yang { color: oklch(0.75 0.15 84 / 0.75); }
            .vert {
                position: absolute; z-index: 3; right: 0.25rem; top: 0.75rem;
                transform: rotate(180deg); transform-origin: top top; writing-mode: vertical-rl; font-weight: 300;
            }
            .relative { position: relative; }
            .center { text-align: center; }
            .uppercase { text-transform: uppercase; }
            .sr_only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1><span>Ba Zi</span><span lang="zh">八字</span></h1>
                <p class="validation_badge">✓ Mathematics meets ancient metaphors</p>
            </header>

            <main>
                <section class="relative">
                    <div class="section_card">
                        <output class="calculated_date_info center" id="calculatedDateInfo" style="display: none;">
                            <div style="font-size: 1.1rem; color: var(--text_secondary);">Ba Zi for</div>
                            <time class="date_display" id="dateDisplay"></time>
                        </output>

                        <!-- 四柱排盘结果展示区 -->
                        <div class="pillars_container" id="pillarsContainer"></div>

                        <!-- Shopify 商业转化引导卡片（已完美植入排盘下方） -->
                        <div id="shopifyCta" style="text-align: center; margin-top: 25px; padding: 25px; background: rgba(0, 20, 0, 0.8); border: 1px solid #00ff6655; border-radius: 10px;">
                            <h3 style="color: #00ff66; margin-bottom: 10px; font-size: 20px; font-weight: 400;">
                                Unlock Your Complete Destiny & Wealth Blueprint
                            </h3>
                            <p style="color: #ccc; font-size: 14px; margin-bottom: 20px; line-height: 1.5;">
                                Based on your Ba Zi chart above, get a comprehensive, personalized English PDF report covering career, wealth, health, and more.
                            </p>
                            <a href="https://你的Shopify店铺域名/cart/add?id=你的商品ID&quantity=1" 
                               target="_blank" 
                               style="display: inline-block; background-color: #00ff66; color: #000; padding: 12px 30px; font-size: 15px; font-weight: bold; text-decoration: none; border-radius: 6px;">
                                Get My Deep Dive Report ➔
                            </a>
                        </div>
                    </div>
                </section>

                <section class="relative">
                    <h2 class="section_title uppercase center">Enter Date</h2>
                    <form class="section_card" onsubmit="event.preventDefault(); calculateBaZi();">
                        <fieldset class="input_grid">
                            <div class="input_group">
                                <label for="year">Year</label>
                                <input type="number" id="year" min="1900" max="2030" value="1987" required />
                            </div>
                            <div class="input_group">
                                <label for="month">Month</label>
                                <input type="number" id="month" min="1" max="12" value="2" required />
                            </div>
                            <div class="input_group">
                                <label for="day">Day</label>
                                <input type="number" id="day" min="1" max="31" value="19" required />
                            </div>
                            <div class="input_group">
                                <label for="hour">Hour (24h)</label>
                                <input type="number" id="hour" min="0" max="23" value="11" required />
                            </div>
                            <div class="input_group">
                                <label for="minute">Minute</label>
                                <input type="number" id="minute" min="0" max="59" value="30" required />
                            </div>
                            <div class="input_group">
                                <label for="timezone">Timezone</label>
                                <select id="timezone" required>
                                    <option value="0">UTC / GMT</option>
                                    <option value="8" selected>Beijing / Shanghai (UTC+8)</option>
                                    <option value="-5">New York (UTC-5)</option>
                                    <option value="-8">Los Angeles (UTC-8)</option>
                                    <option value="9">Tokyo (UTC+9)</option>
                                </select>
                            </div>
                        </fieldset>

                        <button type="submit" id="calculateBtn">CALCULATE</button>
                        <button type="button" onclick="testCurrentTime()" class="stroke">RESET TO NOW</button>
                    </form>
                </section>
            </main>
        </div>

        <script>
            const HEAVENLY_STEMS = {
                names: ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"],
                pinyin: ["Jiǎ", "Yǐ", "Bǐng", "Dīng", "Wù", "Jǐ", "Gēng", "Xīn", "Rén", "Guǐ"],
                elements: ["Wood", "Wood", "Fire", "Fire", "Earth", "Earth", "Metal", "Metal", "Water", "Water"],
                yin_yang: ["Yang", "Yin", "Yang", "Yin", "Yang", "Yin", "Yang", "Yin", "Yang", "Yin"]
            };

            const EARTHLY_BRANCHES = {
                names: ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"],
                pinyin: ["Zǐ", "Chǒu", "Yín", "Mǎo", "Chén", "Sì", "Wǔ", "Wèi", "Shēn", "Yǒu", "Xū", "Hài"],
                animals: ["Rat", "Ox", "Tiger", "Rabbit", "Dragon", "Snake", "Horse", "Goat", "Monkey", "Rooster", "Dog", "Pig"],
                emojis: ["🐀", "🐂", "🐅", "🐇", "🐉", "🐍", "🐎", "🐐", "🐒", "🐓", "🐕", "猪"]
            };

            function gregorianToJulianDay(year, month, day, hour = 0, minute = 0) {
                if (month <= 2) { year -= 1; month += 12; }
                const A = Math.floor(year / 100);
                const B = 2 - A + Math.floor(A / 4);
                return Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5 + (hour + minute / 60) / 24;
            }

            function sunLongitude(jd) {
                const T = (jd - 2451545.0) / 36525;
                const L0 = 280.46646 + 36000.76983 * T;
                const M = 357.52911 + 35999.05029 * T;
                const C = (1.914602) * Math.sin(M * Math.PI / 180) + (0.019993) * Math.sin(2 * M * Math.PI / 180);
                return (L0 + C - 0.00569 + 360) % 360;
            }

            function calculateBaZi() {
                const year = parseInt(document.getElementById("year").value);
                const month = parseInt(document.getElementById("month").value);
                const day = parseInt(document.getElementById("day").value);
                const hour = parseInt(document.getElementById("hour").value);
                const minute = parseInt(document.getElementById("minute").value);
                const timezone = parseFloat(document.getElementById("timezone").value);

                const localDate = new Date(year, month - 1, day, hour, minute, 0);
                const utcDate = new Date(localDate.getTime() - timezone * 3600000);

                const jd = gregorianToJulianDay(utcDate.getUTCFullYear(), utcDate.getUTCMonth() + 1, utcDate.getUTCDate(), utcDate.getUTCHours(), utcDate.getUTCMinutes());
                const longitude = sunLongitude(jd);

                // 粗略太阳黄经节气索引对应
                let solarTermIndex = Math.floor(((longitude - 315 + 360) % 360) / 15);

                // 年柱校准（立春分界）
                let effectiveYear = year;
                if (month <= 2 && solarTermIndex < 2) effectiveYear = year - 1;
                const yearStem = (effectiveYear - 4) % 10;
                const yearBranch = (effectiveYear - 4) % 12;

                // 月柱校准
                const monthBranch = (Math.floor(solarTermIndex / 2) + 2) % 12;
                const monthStem = (yearStem * 2 + monthBranch) % 10;

                // 日柱校准（以 1900-01-31 甲辰日为基准对齐精准干支）
                const referenceJD = gregorianToJulianDay(1900, 1, 31, 0, 0);
                const daysSince = Math.floor(jd - referenceJD);
                const dayStem = (0 + daysSince) % 10;
                const dayBranch = (4 + daysSince) % 12;

                // 时柱校准
                const hourBranch = Math.floor((hour + 1) / 2) % 12;
                const hourStem = (dayStem * 2 + hourBranch) % 10;

                const pillars = [
                    { title: "YEAR", stem: (yearStem + 10) % 10, branch: (yearBranch + 12) % 12 },
                    { title: "MONTH", stem: (monthStem + 10) % 10, branch: (monthBranch + 12) % 12 },
                    { title: "DAY", stem: (dayStem + 10) % 10, branch: (dayBranch + 12) % 12 },
                    { title: "HOUR", stem: (hourStem + 10) % 10, branch: (hourBranch + 12) % 12 }
                ];

                document.getElementById("calculatedDateInfo").style.display = "block";
                document.getElementById("dateDisplay").innerHTML = `${year}-${month}-${day} at ${hour}:${minute} (UTC+8)`;

                document.getElementById("pillarsContainer").innerHTML = pillars.map(p => {
                    const s = HEAVENLY_STEMS.names[p.stem];
                    const b = EARTHLY_BRANCHES.names[p.branch];
                    const el = HEAVENLY_STEMS.elements[p.stem];
                    const animal = EARTHLY_BRANCHES.animals[p.branch];
                    const emoji = EARTHLY_BRANCHES.emojis[p.branch];
                    return `
                        <article class="pillar">
                            <h4 class="pillar_title vert uppercase">${p.title}</h4>
                            <div class="stem_branch">
                                <div><div class="chinese_char">${s}</div><div class="pinyin">${HEAVENLY_STEMS.pinyin[p.stem]}</div></div>
                                <div><div class="chinese_char">${b}</div><div class="pinyin">${EARTHLY_BRANCHES.pinyin[p.branch]}</div></div>
                            </div>
                            <div class="animal_emoji">${emoji}</div>
                            <div class="animal_info">${animal}</div>
                            <div class="element element_${el.toLowerCase()}">${el}</div>
                        </article>
                    `;
                }).join('');
            }

            function testCurrentTime() {
                const now = new Date();
                document.getElementById("year").value = now.getFullYear();
                document.getElementById("month").value = now.getMonth() + 1;
                document.getElementById("day").value = now.getDate();
                document.getElementById("hour").value = now.getHours();
                document.getElementById("minute").value = now.getMinutes();
                calculateBaZi();
            }

            window.onload = calculateBaZi;
        </script>
    </body>
</html>

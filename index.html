<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BaZi Calculator - Astronomically Accurate Four Pillars</title>
        <!-- 引入国内标准、100% 精准的历法与八字计算权威引擎 -->
        <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
        <style>
            :root {
                --color_primary: oklch(0.87 0.28 142);
                --color_primary_light: oklch(0.89 0.25 142);
                --color_secondary: oklch(0.69 0.2 142);
                --bg_dark: oklch(0.15 0.02 142);
                --bg_mid: oklch(0.25 0.05 142);
                --bg_light: oklch(0.18 0.03 142);
                --bg_surface: oklch(1 0 0 / 0.05);
                --bg_surface_hover: oklch(0 0 0 / 0.35);
                --text_primary: oklch(1 0 0);
                --text_secondary: oklch(0.72 0 0);
                --border_visible: 1px solid oklch(1 0 0 / 0.3);
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html { background-color: #000; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: linear-gradient(135deg, var(--bg_dark) 0%, var(--bg_mid) 50%, var(--bg_light) 100%);
                min-height: 100vh;
                color: var(--text_primary);
                padding: 20px;
            }
            .container { max-width: 1000px; margin: 0 auto; }
            header { text-align: center; margin-bottom: 30px; padding: 20px; }
            h1 {
                font-size: 2.5rem;
                margin-bottom: 10px;
                background: linear-gradient(45deg, var(--color_primary), var(--color_primary_light));
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                font-weight: 300;
                display: flex;
                justify-content: space-between;
            }
            .validation_badge {
                display: inline-block;
                color: var(--color_primary);
                border: 1px solid var(--color_primary);
                padding: 5px 15px;
                border-radius: 8px;
                font-size: 0.9rem;
            }
            .section_card {
                background: rgba(0, 30, 10, 0.6);
                border: 1px solid rgba(0, 255, 102, 0.3);
                border-radius: 12px;
                padding: 30px;
                margin-bottom: 30px;
                backdrop-filter: blur(10px);
            }
            h2.section_title {
                text-align: center;
                margin-bottom: 20px;
                font-size: 1.8rem;
                font-weight: 300;
                text-transform: uppercase;
                color: var(--color_primary_light);
            }
            .input_grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
                margin-bottom: 20px;
            }
            .input_group { display: flex; flex-direction: column; }
            label {
                margin-bottom: 8px;
                color: var(--color_primary_light);
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            input, select {
                padding: 12px;
                border: var(--border_visible);
                background: var(--bg_surface);
                color: var(--text_primary);
                border-radius: 6px;
                font-size: 1.1rem;
                width: 100%;
            }
            select option { background-color: #121b14; color: var(--text_primary); }
            button {
                background: linear-gradient(45deg, var(--color_primary), var(--color_secondary));
                color: #000;
                border: none;
                padding: 14px 28px;
                border-radius: 8px;
                font-size: 1.1rem;
                font-weight: bold;
                cursor: pointer;
                margin-right: 10px;
                margin-top: 10px;
            }
            button.stroke {
                background: none;
                color: var(--color_primary);
                border: 2px solid var(--color_primary);
            }
            .pillars_container {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 15px;
                margin-top: 20px;
            }
            .pillar {
                background: var(--bg_surface_hover);
                border-radius: 8px;
                padding: 20px;
                text-align: center;
                border: 2px solid rgba(0, 255, 102, 0.3);
            }
            .pillar_title {
                font-size: 1.2rem;
                color: var(--color_primary_light);
                margin-bottom: 10px;
                opacity: 0.5;
            }
            .chinese_char { font-size: 2.2rem; font-weight: bold; margin: 10px 0; }
            .pinyin { color: var(--text_secondary); font-size: 1.1rem; margin-bottom: 10px; }
            .element {
                display: inline-block;
                padding: 5px 15px;
                border-radius: 20px;
                font-size: 1rem;
                margin-top: 15px;
                font-weight: bold;
            }
            .element_wood { background: rgba(110, 204, 110, 0.3); color: #7fff00; }
            .element_fire { background: rgba(255, 100, 100, 0.3); color: #ff6b6b; }
            .element_earth { background: rgba(218, 165, 32, 0.3); color: #ffd700; }
            .element_metal { background: rgba(220, 220, 220, 0.3); color: #e0e0e0; }
            .element_water { background: rgba(100, 150, 255, 0.3); color: #64b5f6; }
            fieldset { border: none; }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1><span>Ba Zi</span><span lang="zh">八字</span></h1>
                <p class="validation_badge">✓ Professional Astronomical & Almanac Precision</p>
            </header>
            <main>
                <section>
                    <h2 class="section_title">Enter Date</h2>
                    <form class="section_card" onsubmit="event.preventDefault(); calculateBaZi();">
                        <fieldset class="input_grid">
                            <div class="input_group">
                                <label for="year">Year</label>
                                <input type="number" id="year" min="1900" max="2030" placeholder="e.g. 1987" required oninvalid="this.setCustomValidity('Please fill out this field.')" oninput="this.setCustomValidity('')" />
                            </div>
                            <div class="input_group">
                                <label for="month">Month</label>
                                <input type="number" id="month" min="1" max="12" placeholder="1-12" required oninvalid="this.setCustomValidity('Please fill out this field.')" oninput="this.setCustomValidity('')" />
                            </div>
                            <div class="input_group">
                                <label for="day">Day</label>
                                <input type="number" id="day" min="1" max="31" placeholder="1-31" required oninvalid="this.setCustomValidity('Please fill out this field.')" oninput="this.setCustomValidity('')" />
                            </div>
                            <div class="input_group">
                                <label for="hour">Hour</label>
                                <input type="number" id="hour" min="0" max="23" placeholder="0-23" required oninvalid="this.setCustomValidity('Please fill out this field.')" oninput="this.setCustomValidity('')" />
                            </div>
                            <div class="input_group">
                                <label for="minute">Minute</label>
                                <input type="number" id="minute" min="0" max="59" placeholder="Optional" />
                            </div>
                            <div class="input_group">
                                <label for="timezone">Timezone</label>
                                <select id="timezone" onchange="calculateBaZi()">
                                    <option value="-5" selected>Eastern Time (EST): UTC-5</
